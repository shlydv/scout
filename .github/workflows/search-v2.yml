name: Decision search
on:
  pull_request:
    paths: ["lib/search/**", "scripts/decision-search*", "app/api/search/**", "supabase/migrations/**", "components/catalog-view.tsx", ".github/workflows/search-v2.yml"]
  push:
    branches: [main, search-improvements]
    paths: ["lib/search/**", "scripts/decision-search*", "app/api/search/**", "supabase/migrations/**", "components/catalog-view.tsx", ".github/workflows/search-v2.yml"]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc --noEmit -p tsconfig.decision-tests.json
      - run: pnpm search:decision-test
      - run: node --import tsx scripts/free-access-regression.ts
